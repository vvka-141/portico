version: 2

# Pinning actions to SHAs is only sustainable if something keeps the pins current — otherwise
# "pinned" quietly becomes "stale, and nobody noticed". Dependabot opens the PRs that update them,
# rewriting both the SHA and the trailing version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Reads Directory.Packages.props (central package management). Note the CORE package has zero
  # dependencies — the blast radius here is build/test tooling (xunit, Roslyn, the test SDK). That
  # tooling is nonetheless exactly what will run alongside the release job's NUGET_API_KEY, which is
  # the reason to watch it at all.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
