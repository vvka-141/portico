name: Release

# Fires ONLY on a v* tag. Pushing that tag is the release action — nothing else publishes.
# MinVer derives the package version from the tag: v0.2.0 -> 0.2.0.
#
# Publishing uses nuget.org Trusted Publishing, not an API key. There is no NUGET_API_KEY secret
# and there should never be one. What the repository needs instead:
#
#   1. A Trusted Publishing policy at nuget.org -> your username -> Trusted Publishing:
#          Repository Owner:  vvka-141
#          Repository:        portico
#          Workflow File:     release.yml      (file name only, no .github/workflows/ prefix)
#          Environment:       release          (must match the publish job's `environment:` below)
#   2. A NUGET_USER repository secret holding the nuget.org *profile name* that owns the policy.
#      Not an email address, and not a credential — it is a secret only to keep it out of logs.
#   3. A GitHub environment named `release` (Settings -> Environments) carrying at least one
#      protection rule. Without one the environment exists but gates nothing — see the publish job.
#
# A policy is scoped to its owner and covers every package that owner owns. Renaming this file
# invalidates the policy until nuget.org is updated to match, which is why the name is repeated
# in the comment above the login step.
#
# ORDER MATTERS, AND ONLY IN ONE DIRECTION. nuget.org's environment field is a *filter*, not a
# handshake: per NuGet's accepted design, the claim is checked only "if an environment filter is
# provided in the trust policy". So —
#     workflow declares `environment:`, policy field empty  -> authenticates (claim not checked)
#     policy field set,  workflow declares no environment   -> FAILS
# Set the workflow side first (done), the nuget.org side second. Never the reverse (POR-111).
on:
  push:
    tags: ['v*']

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish to nuget.org
    needs: verify
    runs-on: ubuntu-latest

    # The job that can mint a nuget.org publishing credential. Before this line, the complete
    # authorisation check for an irreversible publish to a public registry was "can you push a tag
    # matching v*". Trusted Publishing removed the secret to steal; it did not remove that (POR-111).
    #
    # Two things this buys, and one it does not:
    #   - it puts the `environment` claim in the OIDC token, so the nuget.org policy can narrow from
    #     "any run of release.yml in this repo" to "any run that cleared this environment's rules";
    #   - it gives GitHub a place to require a reviewer or restrict which refs may deploy.
    #   - it does NOT gate anything by itself. GitHub creates a referenced environment implicitly,
    #     and an environment with no protection rules approves instantly. The rule is a repository
    #     setting, not a file in this tree — which is exactly why the header above lists it as a
    #     prerequisite rather than leaving it to be inferred.
    environment: release

    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # to request the OIDC token Trusted Publishing exchanges for a key

    # A nuget.org version is immutable. Everything that can fail is therefore checked BEFORE the
    # push: a bad changelog or a misversioned package discovered afterwards cannot be corrected,
    # only superseded. `--skip-duplicate` makes a corrective re-tag worse, not better — it would
    # silently skip the republish and leave nuget.org serving the original artifacts.
    steps:
      # Fail here rather than after the preflight. An unset NUGET_USER surfaces at the login step
      # as an opaque authentication error, four minutes and every check later, and the fix is a
      # repository setting rather than anything in the tree.
      - name: Check the Trusted Publishing prerequisites
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER is not set. Trusted Publishing needs the nuget.org profile" \
                 "name that owns the publishing policy — see the comment at the top of this file." >&2
            exit 1
          fi
          echo "Publishing as nuget.org user '$NUGET_USER' via Trusted Publishing."

      # Checkout first: actions/checkout cleans the workspace, so it must precede the download.
      - name: Checkout (release preflight)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            eng
            CHANGELOG.md

      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg
          path: ./artifacts

      - name: Show what will be published
        run: ls -la ./artifacts

      - name: Verify the packed artifacts carry the tagged version
        run: bash eng/verify-release-artifacts.sh "${GITHUB_REF_NAME#v}" ./artifacts

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash eng/extract-changelog-section.sh "$version" CHANGELOG.md > release-notes.md
          echo "--- extracted notes for $version ($(wc -l < release-notes.md) lines) ---"

      # Trusted Publishing: nuget.org exchanges this job's GitHub OIDC token for an API key that
      # lives one hour and is good for a single exchange. No long-lived secret exists to leak,
      # rotate, or forget. The policy on nuget.org is matched against the repository owner, the
      # repository, and *this file's name* — renaming release.yml breaks publishing until the
      # policy is updated to match.
      #
      # Deliberately the last step before the push. The key expires in an hour, and every fallible
      # check above must have passed before there is any reason to hold a credential at all.
      - name: Exchange the OIDC token for a short-lived nuget.org key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Past this line the release is irreversible.
      #
      # No --skip-duplicate. It was here once and it turned three 409s into a green v0.1.0 release
      # that shipped one package out of four (POR-141). A conflict during a release is never
      # benign: the version is immutable, so a silent skip means the release did nothing, and a
      # conflict on a new ID means the ID is unavailable. Both must be loud.
      - name: Publish to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # A 201 means nuget.org accepted the upload, not that the package exists. Validation runs
      # afterwards and can reject it, so confirm each package actually resolves before publishing
      # release notes that promise all four.
      - name: Confirm every package is live on nuget.org
        run: bash eng/verify-published-packages.sh "${GITHUB_REF_NAME#v}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md
          ./artifacts/*.nupkg
