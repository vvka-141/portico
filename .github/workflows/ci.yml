name: CI

# The always-green gate. Runs on every push to main and every PR.
# This workflow PUBLISHES NOTHING — tag-driven release lives in release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
