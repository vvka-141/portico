name: Verify

# Reusable verification gate — the single source of truth for what "green" means.
# Both ci.yml and release.yml call this; neither duplicates any step.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The BUILD SDK comes from global.json, which Dependabot's `dotnet-sdk` ecosystem keeps
      # current — one automated surface instead of a version pinned here and another pinned there,
      # drifting apart silently (POR-146).
      #
      # `8.0.x` STAYS, and is not an SDK pin. It installs the .NET 8 RUNTIME, which is what the
      # net8.0 test leg executes on; without it `dotnet test` runs only half the matrix and still
      # reports success. Both inputs compose — actions/setup-dotnet installs the versions from
      # `dotnet-version` AND the one resolved from `global-json-file`.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Check docs integrity
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/check-docs-links.sh

      # The template's substitution tokens must stay explicit placeholders. A symbol declared as
      # `"replaces": "net10.0"` rewrites every occurrence of that string anywhere in the template
      # content — prose included — and the failure is silent (POR-123).
      - name: Check template substitution tokens
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/check-template-tokens.sh

      # The release workflow extracts its notes with this script. If it is broken, the failure
      # surfaces mid-release — after the tag is pushed, so recovery means deleting a tag and
      # re-cutting it. Run its tests on every push instead, where a break costs a commit.
      #
      # This comment used to end "after the packages are irreversibly on nuget.org", which is not
      # what release.yml does: notes are extracted several steps BEFORE the nuget push, and the
      # push is deliberately the last fallible thing in the job. The ordering is the safeguard;
      # this step is the convenience. Both are worth having, for different reasons.
      - name: Test the changelog extractor
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/test-extract-changelog-section.sh

      # And the extractor against the real CHANGELOG.md, not only its fixture. A section that is
      # present but empty passes every test above and still fails the release.
      - name: Check the changelog shape
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/check-changelog-shape.sh

      # Same argument, and it applies harder: this is the script that decides whether the push
      # happens at all. A guard nobody tests is a guard nobody should trust.
      - name: Test the release artifact preflight
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/test-verify-release-artifacts.sh

      # The lifecycle radar runs on a weekly schedule, not here — a target framework entering
      # maintenance is a decision to schedule, not a build break. Its LOGIC is gated here, against
      # fixtures, because a radar that silently stopped parsing would report "all clear" forever and
      # nothing else would notice (POR-146).
      - name: Test the .NET lifecycle radar
        if: matrix.os == 'ubuntu-latest'
        run: bash eng/test-check-dotnet-lifecycle.sh

      - name: Restore
        run: dotnet restore portico.sln

      - name: Build
        run: dotnet build portico.sln -c Release --no-restore

      - name: Test
        run: dotnet test portico.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack portico.sln -c Release --no-build -o ./artifacts

      - name: Verify packed nupkg contents
        run: >
          dotnet test test/Portico.Packaging.Tests -c Release
          -e PORTICO_ARTIFACTS=${{ github.workspace }}/artifacts
          --verbosity normal

      # Compile the samples that ship INSIDE each package, against that package's own declared
      # dependency closure restored from ./artifacts. Two defects in a six-line snippet shipped in
      # 0.1.0 and again in 0.1.1 because nothing ever compiled them the way a reader would — inside
      # the solution every namespace and assembly resolves for free (POR-155). One project per
      # package, because Portico.Hosting pulls the DI implementation in transitively and a shared
      # project would have hidden exactly the defect this exists to catch.
      - name: Compile the package README samples
        shell: bash
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/Portico.[0-9]*.nupkg | head -1)
          version=$(basename "$nupkg" .nupkg)
          version=${version#Portico.}
          echo "Compiling package samples against Portico $version"
          for sample in Core DependencyInjection Hosting; do
            dotnet build "test/Portico.PackageSamples/$sample" -c Release -p:PorticoSampleVersion="$version"
          done

      - name: Smoke-test the dotnet new template
        shell: bash
        run: |
          set -euo pipefail
          version=$(ls artifacts/Portico.Templates.*.nupkg | sed -E 's/.*Portico\.Templates\.(.*)\.nupkg/\1/')
          echo "Scaffolding against Portico $version"

          dotnet new install "artifacts/Portico.Templates.$version.nupkg"

          for tfm in default net10.0 net8.0; do
            framework_args=()
            expected_tfm="$tfm"
            if [[ "$tfm" == "default" ]]; then
              # The template's default. Kept in step with
              # PublicDocumentation_Should.Default_The_Template_To_The_Newest_Supported_Framework,
              # which asserts the default is the newest TFM Portico supports — a scaffolding default
              # is chosen for people who have not formed an opinion, so it must not point at the
              # runtime closest to end of support.
              expected_tfm="net10.0"
              echo "=== Smoke-testing template default ($expected_tfm) ==="
            else
              framework_args=(--framework "$tfm")
              echo "=== Smoke-testing template with --framework $tfm ==="
            fi

            scaffold="$RUNNER_TEMP/scaffold-$tfm"
            mkdir -p "$scaffold" && cd "$scaffold"
            dotnet new portico-cli -n SmokeCli --porticoVersion "$version" "${framework_args[@]}"
            cd SmokeCli

            grep -q "<TargetFramework>$expected_tfm</TargetFramework>" SmokeCli/SmokeCli.csproj

            # printf, not a heredoc: a heredoc body inside a YAML block scalar keeps the
            # indentation that makes it readable here, and an XML declaration with anything at
            # all before it is invalid. That failed on both runners with "Unexpected XML
            # declaration ... no whitespace characters are allowed to appear before it".
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<configuration>' \
              '  <packageSources>' \
              "    <add key=\"local\" value=\"$GITHUB_WORKSPACE/artifacts\" />" \
              '  </packageSources>' \
              '</configuration>' > nuget.config

            # Prove the declaration is at byte zero before handing the file to restore, which
            # reports a malformed config as a build error against every project and buries the
            # cause several hundred lines down.
            first_line=$(head -1 nuget.config)
            if [[ "$first_line" != '<?xml'* ]]; then
              echo "nuget.config does not open with its XML declaration: [$first_line]" >&2
              exit 1
            fi

            dotnet build -c Release
            dotnet test  -c Release --no-build
            dotnet run --project SmokeCli -c Release --no-build -- greet --name Ada

            # The item template, exercised where it is actually used: inside a project that already
            # exists. An untested template variant is a broken one (POR-121). Both handler shapes,
            # because --async selects a different conditional block in both emitted files.
            (
              cd SmokeCli
              dotnet new portico-command -n Migrate --route "db migrate"
              dotnet new portico-command -n Backfill --async
            )
            dotnet build -c Release
            dotnet test  -c Release --no-build
          done

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
